name: Build Android app

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder
        id: proj
        run: |
          F=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -1)
          if [ -z "$F" ]; then echo "settings.gradle not found. Upload all the files from the EWIS Coverage Android folder."; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$F")"
          echo "Android SDK: $ANDROID_HOME"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Update app settings for Google Play
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          # Package name must match the Play Console app
          sed -i "s/applicationId '[^']*'/applicationId 'firify.engineering'/" app/build.gradle
          # Play requires API 36
          sed -i -E "s/compileSdk [0-9]+/compileSdk 36/; s/targetSdk [0-9]+/targetSdk 36/" app/build.gradle
          # New version number (Play already has version 3)
          sed -i -E "s/versionCode [0-9]+/versionCode 4/" app/build.gradle
          # Newer Android build tools that support API 36
          for f in build.gradle settings.gradle; do
            [ -f "$f" ] && sed -i -E "s/(com\.android\.tools\.build:gradle:)[0-9.]+/\18.11.1/; s/(id ['\"]com\.android\.application['\"] version ['\"])[0-9.]+/\18.11.1/" "$f"
          done
          echo "---- app/build.gradle ----"
          grep -E "applicationId|compileSdk|targetSdk|versionCode" app/build.gradle
          echo "---- build tools ----"
          grep -hE "com\.android" build.gradle settings.gradle 2>/dev/null || true

      - name: Bundle the 3D library so the app works offline
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          curl -fsSL -o app/src/main/assets/www/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          curl -fsSL -o app/src/main/assets/www/OrbitControls.js https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js

      - name: Build APK and Play Store bundle
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug bundleRelease --no-daemon

      - name: Collect files
        run: |
          cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" EWIS-Coverage.apk
          cp "${{ steps.proj.outputs.dir }}/app/build/outputs/bundle/release/app-release.aab" EWIS-Coverage.aab

      - name: Upload APK (for installing directly on tablets)
        uses: actions/upload-artifact@v4
        with:
          name: EWIS-Coverage-Android
          path: EWIS-Coverage.apk
          if-no-files-found: error

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: EWIS-Coverage-PlayStore
          path: EWIS-Coverage.aab
          if-no-files-found: error
